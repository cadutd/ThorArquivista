services:
  postgres:
    image: postgres:16-alpine
    container_name: thor-postgres
    environment:
      POSTGRES_DB: thor_db
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: thor
    ports:
      - "5432:5432"
    volumes:
      - thor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thor -d thor_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: thor-redis
    ports:
      - "6379:6379"
    volumes:
      - thor_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: thor-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: "dev-meili-key"
    ports:
      - "7700:7700"
    volumes:
      - thor_meili_data:/meili_data

  keycloak_db:
    image: postgres:16-alpine
    container_name: thor-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - thor_keycloak_db_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: thor-keycloak
    depends_on:
      - keycloak_db
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"

  backend:
    build:
      context: ./backend
    container_name: thor-backend
    depends_on:
      - postgres
      - redis
      - meilisearch
      - keycloak
    environment:
      # 🔑 EXACT MATCH com app/core/config.py
      app_env: dev
      app_name: "Thor Gestor de Arquivos Digitais"
      database_url: postgresql+psycopg://thor:thor@postgres:5432/thor_db

      # Guardadas para uso futuro (não quebram o Settings)
      redis_url: redis://redis:6379/0
      meili_url: http://meilisearch:7700
      meili_master_key: dev-meili-key
      keycloak_url: http://keycloak:8080
      keycloak_realm: thor
      keycloak_client_id: thor-api

    ports:
      - "8000:8000"
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
