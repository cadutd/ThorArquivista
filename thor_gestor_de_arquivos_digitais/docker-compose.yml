services:
  postgres:
    image: postgres:16-alpine
    container_name: thor-postgres
    environment:
      POSTGRES_DB: thor_db
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: thor
    ports:
      - "5432:5432"
    volumes:
      - thor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thor -d thor_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: thor-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thor.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Faz o pgAdmin importar o servers.json automaticamente
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # ✅ aponta para o seu arquivo montado
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/provisioning/servers/servers.json

      # ✅ força importar/substituir a cada start
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"      
    ports:
      - "5050:80"
    volumes:
      - thor_pgadmin_data:/var/lib/pgadmin
      # Arquivo de configuração dos servidores (veja abaixo como criar)
      - ./pgadmin/provisioning:/pgadmin4/provisioning:ro

  redis:
    image: redis:7-alpine
    container_name: thor-redis
    ports:
      - "6379:6379"
    volumes:
      - thor_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: thor-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: "dev-meili-key"
    ports:
      - "7700:7700"
    volumes:
      - thor_meili_data:/meili_data

  keycloak_db:
    image: postgres:16-alpine
    container_name: thor-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - thor_keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: thor-keycloak
    depends_on:
      keycloak_db:
        condition: service_healthy
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"

  backend:
    build:
      context: ./backend
    container_name: thor-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      app_env: dev
      app_name: "Thor Gestor de Arquivos Digitais"
      database_url: postgresql+psycopg://thor:thor@postgres:5432/thor_db

      redis_url: redis://redis:6379/0
      meili_url: http://meilisearch:7700
      meili_master_key: dev-meili-key
      keycloak_url: http://localhost:8081
      keycloak_internal_url: http://keycloak:8080
      keycloak_realm: thor
      keycloak_client_id: thor-api
      keycloak_verify_audience: "true"

    ports:
      - "8000:8000"
    command: >
      sh -c "
      until pg_isready -h postgres -p 5432 -U thor -d thor_db; do
        echo 'Aguardando Postgres...';
        sleep 2;
      done;
      cd /app &&
      alembic -c alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  thor_postgres_data:
  thor_pgadmin_data:
  thor_redis_data:
  thor_meili_data:
  thor_keycloak_db_data:
