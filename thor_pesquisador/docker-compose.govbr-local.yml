# Optional local HTTPS overlay; never use its internal CA or dev login in production.
services:
  backend:
    environment:
      public_app_url: https://localhost:8443
      cors_origins: '["https://localhost:8443"]'
      govbr_redirect_uri: https://localhost:8443/api/v1/auth/govbr/callback
      govbr_client_secret_file: /run/secrets/govbr_client_secret
      session_cookie_secure: "true"
    secrets:
      - govbr_client_secret
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://localhost:8443/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://localhost:8443/api/v1
  govbr_https:
    image: caddy:2.10.2-alpine
    depends_on: [backend, frontend]
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./deploy/dev/govbr/Caddyfile:/etc/caddy/Caddyfile:ro
      - govbr_https_data:/data
      - govbr_https_config:/config
    restart: unless-stopped
secrets:
  govbr_client_secret:
    file: ./.secrets/govbr_client_secret.txt
volumes:
  govbr_https_data:
  govbr_https_config:
