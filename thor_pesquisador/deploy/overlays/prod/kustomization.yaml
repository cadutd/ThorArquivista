apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: thor-pesquisador-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - GOVBR_DEV_LOGIN=false
      - DEV_ADMIN_ENABLED=false
      - SESSION_COOKIE_SECURE=true
patches:
  - path: patch-prod.yaml
