apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thor-pesquisador-postgres
spec:
  serviceName: thor-pesquisador-postgres
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-postgres
  template:
    metadata:
      labels:
        app: thor-pesquisador-postgres
    spec:
      containers:
        - name: thor-pesquisador-postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: thor_pesquisador
            - name: POSTGRES_USER
              value: thor
            - name: POSTGRES_PASSWORD
              value: thor
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thor-pesquisador-postgres
spec:
  selector:
    app: thor-pesquisador-postgres
  ports:
    - port: 5432
      targetPort: 5432
