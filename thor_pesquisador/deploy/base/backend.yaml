apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-backend
  template:
    metadata:
      labels:
        app: thor-pesquisador-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
      containers:
        - name: thor-pesquisador-backend
          image: thor-pesquisador-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: thor-pesquisador-config
            - secretRef:
                name: thor-pesquisador-secrets
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: thor-pesquisador-backend
spec:
  selector:
    app: thor-pesquisador-backend
  ports:
    - port: 8000
      targetPort: 8000
