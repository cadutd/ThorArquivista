apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-meilisearch
  template:
    metadata:
      labels:
        app: thor-pesquisador-meilisearch
    spec:
      containers:
        - name: thor-pesquisador-meilisearch
          image: getmeili/meilisearch:v1.11
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: thor-pesquisador-secrets
                  key: MEILISEARCH_API_KEY
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: thor-pesquisador-meilisearch-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thor-pesquisador-meilisearch-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thor-pesquisador-meilisearch
spec:
  selector:
    app: thor-pesquisador-meilisearch
  ports:
    - port: 7700
      targetPort: 7700
