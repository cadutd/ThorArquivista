apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-index-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-index-worker
  template:
    metadata:
      labels:
        app: thor-pesquisador-index-worker
    spec:
      containers:
        - name: thor-pesquisador-index-worker
          image: thor-pesquisador-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: thor-pesquisador-config
            - secretRef:
                name: thor-pesquisador-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
