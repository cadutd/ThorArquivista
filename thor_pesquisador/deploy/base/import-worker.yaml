apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-import-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: thor-pesquisador-import-worker}
  template:
    metadata:
      labels: {app: thor-pesquisador-import-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 4Gi}
      containers:
        - name: thor-pesquisador-import-worker
          image: thor-pesquisador-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.import_worker"]
          envFrom:
            - configMapRef: {name: thor-pesquisador-config}
            - secretRef: {name: thor-pesquisador-secrets}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
          resources:
            requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 2Gi}
            limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 5Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
