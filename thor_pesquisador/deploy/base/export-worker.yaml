apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-export-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-export-worker
  template:
    metadata:
      labels:
        app: thor-pesquisador-export-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: thor-pesquisador-export-worker
          image: thor-pesquisador-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.export_worker"]
          envFrom:
            - configMapRef:
                name: thor-pesquisador-config
            - secretRef:
                name: thor-pesquisador-secrets
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
