apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thor-pesquisador-http-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [thor-pesquisador-backend, thor-pesquisador-frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [openshift-monitoring, openshift-user-workload-monitoring]
        - podSelector:
            matchLabels:
              app: thor-pesquisador-frontend
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 3000}
