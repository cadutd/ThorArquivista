apiVersion: apps/v1
kind: Deployment
metadata:
  name: thor-pesquisador-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thor-pesquisador-redis
  template:
    metadata:
      labels:
        app: thor-pesquisador-redis
    spec:
      containers:
        - name: thor-pesquisador-redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: thor-pesquisador-redis
spec:
  selector:
    app: thor-pesquisador-redis
  ports:
    - port: 6379
      targetPort: 6379
