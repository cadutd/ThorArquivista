services:
  minio:
    container_name: thor_pesquisador_minio
    build:
      context: ./deploy/dev/minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-thor-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-thor-minio-dev-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - thor_pesquisador_minio:/data

  postgres:
    container_name: thor_pesquisador_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thor_pesquisador}
      POSTGRES_USER: ${POSTGRES_USER:-thor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thor}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - thor_pesquisador_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-thor} -d ${POSTGRES_DB:-thor_pesquisador}
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    container_name: thor_pesquisador_mongo
    image: mongo:7
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27018}:27017"
    volumes:
      - thor_pesquisador_mongo:/data/db

  redis:
    container_name: thor_pesquisador_redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"

  meilisearch:
    container_name: thor_pesquisador_meilisearch
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-dev-master-key-123}
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - thor_pesquisador_meili:/meili_data

  backend:
    container_name: thor_pesquisador_backend
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment: &app-environment
      app_env: ${APP_ENV:-dev}
      database_url: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-thor}:${POSTGRES_PASSWORD:-thor}@postgres:5432/${POSTGRES_DB:-thor_pesquisador}}
      mongodb_url: ${MONGODB_URL:-mongodb://mongo:27017/thor_pesquisador}
      mongodb_database: ${MONGODB_DATABASE:-thor_pesquisador}
      cors_origins: ${CORS_ORIGINS:-["http://localhost:3000"]}
      public_app_url: ${PUBLIC_APP_URL:-http://localhost:3000}
      govbr_redirect_uri: ${GOVBR_REDIRECT_URI:-http://10.6.40.57:8000/api/v1/auth/govbr/callback}
      govbr_authorize_url: ${GOVBR_AUTHORIZE_URL:-https://hml-prodesp.id.cyberark.cloud/OAuth2/Authorize/apesp_hml}
      govbr_token_url: ${GOVBR_TOKEN_URL:-https://hml-prodesp.id.cyberark.cloud/OAuth2/Token/apesp_hml}
      govbr_jwks_url: ${GOVBR_JWKS_URL:-}
      govbr_userinfo_url: ${GOVBR_USERINFO_URL:-https://hml-prodesp.id.cyberark.cloud/OAuth2/UserInfo/apesp_hml}
      govbr_authentication_url: ${GOVBR_AUTHENTICATION_URL:-https://hml-prodesp.id.cyberark.cloud/run}
      govbr_appkey: ${GOVBR_APPKEY:-65d8b079-bb7a-4158-b1e2-75731bc5f44d}
      govbr_suffix_urls: ${GOVBR_SUFFIX_URLS:-apesp_hml}
      govbr_customer_id: ${GOVBR_CUSTOMER_ID:-abc4967}
      govbr_username: ${GOVBR_USERNAME:-user@idpsp}
      govbr_client_id: ${GOVBR_CLIENT_ID:-change-me}
      govbr_client_secret: ${GOVBR_CLIENT_SECRET:-change-me}
      app_session_secret: ${APP_SESSION_SECRET:-dev-change-me}
      govbr_dev_login: ${GOVBR_DEV_LOGIN:-true}
      dev_admin_enabled: ${DEV_ADMIN_ENABLED:-true}
      session_cookie_secure: ${SESSION_COOKIE_SECURE:-false}
      redis_url: ${REDIS_URL:-redis://redis:6379/0}
      indexacao_queue_name: ${INDEXACAO_QUEUE_NAME:-thor_pesquisador:indexacao}
      meilisearch_url: ${MEILISEARCH_URL:-http://meilisearch:7700}
      meilisearch_api_key: ${MEILISEARCH_API_KEY:-dev-master-key-123}
      indexacao_batch_size: "500"
      importacao_max_bytes: ${IMPORTACAO_MAX_BYTES:-2147483648}
      importacao_max_registros: ${IMPORTACAO_MAX_REGISTROS:-1000000}
      importacao_chunk_bytes: ${IMPORTACAO_CHUNK_BYTES:-8388608}
      importacao_batch_size: ${IMPORTACAO_BATCH_SIZE:-1000}
      importacao_batch_bytes: ${IMPORTACAO_BATCH_BYTES:-8388608}
      importacao_retencao_dias: ${IMPORTACAO_RETENCAO_DIAS:-7}
      s3_endpoint_url: ${S3_ENDPOINT_URL:-http://minio:9000}
      s3_bucket: ${S3_BUCKET:-thor-pesquisador-imagens}
      s3_region: ${S3_REGION:-us-east-1}
      s3_access_key_id: ${S3_ACCESS_KEY_ID:-thor-minio}
      s3_secret_access_key: ${S3_SECRET_ACCESS_KEY:-thor-minio-dev-only}
      s3_force_path_style: ${S3_FORCE_PATH_STYLE:-true}
      upload_max_bytes: "20971520"
      upload_allowed_mime_types: '["image/jpeg","image/png","image/tiff","image/webp"]'
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "
      alembic -c alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  index_worker:
    container_name: thor_pesquisador_index_worker
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      app_env: ${APP_ENV:-dev}
      database_url: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-thor}:${POSTGRES_PASSWORD:-thor}@postgres:5432/${POSTGRES_DB:-thor_pesquisador}}
      mongodb_url: ${MONGODB_URL:-mongodb://mongo:27017/thor_pesquisador}
      mongodb_database: ${MONGODB_DATABASE:-thor_pesquisador}
      redis_url: ${REDIS_URL:-redis://redis:6379/0}
      indexacao_queue_name: ${INDEXACAO_QUEUE_NAME:-thor_pesquisador:indexacao}
      meilisearch_url: ${MEILISEARCH_URL:-http://meilisearch:7700}
      meilisearch_api_key: ${MEILISEARCH_API_KEY:-dev-master-key-123}
      indexacao_batch_size: "500"
    command: python -m app.worker

  export_worker:
    container_name: thor_pesquisador_export_worker
    build: ./backend
    depends_on: [backend]
    environment: *app-environment
    command: python -m app.export_worker

  import_worker:
    container_name: thor_pesquisador_import_worker
    build: ./backend
    depends_on: [backend]
    environment: *app-environment
    command: python -m app.import_worker

  retention_scheduler:
    container_name: thor_pesquisador_retention_scheduler
    build: ./backend
    depends_on: [backend]
    environment: *app-environment
    command: python -m app.retention_worker --loop --intervalo-segundos 60

  retention_worker:
    container_name: thor_pesquisador_retention_worker
    profiles: [jobs]
    build: ./backend
    depends_on: [backend]
    environment: *app-environment
    command: python -m app.retention_worker

  frontend:
    container_name: thor_pesquisador_frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${API_BASE_URL:-http://localhost:8000/api/v1}}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-${API_BASE_URL:-http://localhost:8000/api/v1}}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"

volumes:
  thor_pesquisador_minio:
  thor_pesquisador_postgres:
  thor_pesquisador_mongo:
  thor_pesquisador_meili:
