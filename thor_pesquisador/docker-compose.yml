services:
  minio:
    container_name: thor_pesquisador_minio
    build:
      context: ./deploy/dev/minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-thor-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-thor-minio-dev-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - thor_pesquisador_minio:/data

  postgres:
    container_name: thor_pesquisador_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thor_pesquisador
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: thor
    ports:
      - "5434:5432"
    volumes:
      - thor_pesquisador_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thor -d thor_pesquisador"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    container_name: thor_pesquisador_mongo
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - thor_pesquisador_mongo:/data/db

  redis:
    container_name: thor_pesquisador_redis
    image: redis:7-alpine
    ports:
      - "6380:6379"

  meilisearch:
    container_name: thor_pesquisador_meilisearch
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev-master-key-123
    ports:
      - "7700:7700"
    volumes:
      - thor_pesquisador_meili:/meili_data

  backend:
    container_name: thor_pesquisador_backend
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      app_env: dev
      database_url: postgresql+psycopg://thor:thor@postgres:5432/thor_pesquisador
      mongodb_url: mongodb://mongo:27017/thor_pesquisador
      mongodb_database: thor_pesquisador
      cors_origins: '["http://localhost:3000"]'
      public_app_url: http://localhost:3000
      govbr_redirect_uri: http://localhost:8000/api/v1/auth/govbr/callback
      govbr_client_id: change-me
      govbr_client_secret: change-me
      app_session_secret: dev-change-me
      govbr_dev_login: "true"
      redis_url: redis://redis:6379/0
      indexacao_queue_name: thor_pesquisador:indexacao
      meilisearch_url: http://meilisearch:7700
      meilisearch_api_key: dev-master-key-123
      indexacao_batch_size: "500"
      s3_endpoint_url: ${S3_ENDPOINT_URL:-http://minio:9000}
      s3_bucket: ${S3_BUCKET:-thor-pesquisador-imagens}
      s3_region: ${S3_REGION:-us-east-1}
      s3_access_key_id: ${S3_ACCESS_KEY_ID:-thor-minio}
      s3_secret_access_key: ${S3_SECRET_ACCESS_KEY:-thor-minio-dev-only}
      s3_force_path_style: "true"
      upload_max_bytes: "20971520"
      upload_allowed_mime_types: '["image/jpeg","image/png","image/tiff","image/webp"]'
    ports:
      - "8000:8000"
    command: >
      sh -c "
      alembic -c alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  index_worker:
    container_name: thor_pesquisador_index_worker
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      app_env: dev
      database_url: postgresql+psycopg://thor:thor@postgres:5432/thor_pesquisador
      mongodb_url: mongodb://mongo:27017/thor_pesquisador
      mongodb_database: thor_pesquisador
      redis_url: redis://redis:6379/0
      indexacao_queue_name: thor_pesquisador:indexacao
      meilisearch_url: http://meilisearch:7700
      meilisearch_api_key: dev-master-key-123
      indexacao_batch_size: "500"
    command: python -m app.worker

  frontend:
    container_name: thor_pesquisador_frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  thor_pesquisador_minio:
  thor_pesquisador_postgres:
  thor_pesquisador_mongo:
  thor_pesquisador_meili:
